<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cue Studio">
  <title>Cue Studio</title>
  <!-- Favicon. Same monogram as the wordmark, isolated and square.
       Renders clean at 16x16 because the glyph is built from two
       primitives only (circle + line) inside a high-contrast frame. -->
  <rect width="64" height="64" rx="14" fill="#0a0a0f"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#fbbf24" stroke-width="3.5"/>
  <line x1="14" y1="32" x2="50" y2="32" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
</svg>