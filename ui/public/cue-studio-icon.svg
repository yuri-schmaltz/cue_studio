<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cue Studio">
  <title>Cue Studio</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
  <!-- Film clapperboard -->
  <g filter="url(#glow)">
    <!-- Top clapper (angled) -->
    <path d="M12 16 L52 10 L52 20 L12 26 Z" fill="url(#gold)" rx="2"/>
    <!-- Stripes on clapper -->
    <g stroke="#0a0a0f" stroke-width="2" opacity="0.55">
      <line x1="20" y1="14" x2="18" y2="25"/>
      <line x1="28" y1="13" x2="26" y2="24"/>
      <line x1="36" y1="12" x2="34" y2="23"/>
      <line x1="44" y1="11" x2="42" y2="22"/>
    </g>
    <!-- Board -->
    <rect x="12" y="26" width="40" height="24" rx="3" fill="url(#gold)"/>
    <!-- Board lines (script) -->
    <g stroke="#0a0a0f" stroke-width="1.5" opacity="0.35">
      <line x1="16" y1="32" x2="48" y2="32"/>
      <line x1="16" y1="37" x2="44" y2="37"/>
      <line x1="16" y1="42" x2="40" y2="42"/>
    </g>
    <!-- Play triangle -->
    <path d="M26 30 L40 38 L26 46 Z" fill="#0a0a0f" opacity="0.75"/>
  </g>
</svg>