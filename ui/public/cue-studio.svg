<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img" aria-label="Cue Studio">
  <title>Cue Studio</title>
  <!-- Monogram: rounded square (favicon DNA) + take marker glyph.
       The take marker is a film slate's center clapper: a small
       circle with a horizontal bar — universally readable as "take"
       in cinema iconography, distinct from a play button because the
       circle is open and the bar bisects it. -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="60" height="60" rx="14" fill="#0a0a0f"/>
    <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <!-- take marker glyph -->
    <circle cx="32" cy="32" r="14" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <line x1="14" y1="32" x2="50" y2="32" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Wordmark. Geometric sans, slightly tracked. Two-color: 'Cue'
       in warm amber (active brand color) + 'Studio' in muted cream.
       The contrast keeps the brand readable when scaled down. -->
  <g transform="translate(76, 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <text x="0" y="40" font-size="32" font-weight="700" fill="#f59e0b" letter-spacing="-0.5">Cue</text>
    <text x="58" y="40" font-size="32" font-weight="400" fill="#9898a8" letter-spacing="-0.3">Studio</text>
  </g>
</svg>