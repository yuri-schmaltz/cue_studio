[package]
name = "cue-studio-desktop"
version = "2.5.2"
edition = "2021"
rust-version = "1.85"
description = "Cue Studio desktop application and local AI runtime supervisor"
license-file = "../../LICENSE"

[lib]
name = "cue_studio_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "cue-studio-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
libc = "0.2"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
